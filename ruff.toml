line-length = 100
target-version = "py312"
src = ["src", "tests"]

[lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "TID",
    "PL",
]
ignore = [
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "B008",
]

[lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG001", "ARG002"]

[lint.isort]
known-first-party = ["adp"]
